[project]
name = "triage-db"
version = "0.1.0"
description = "Postgres schema, repositories, queue, and audit log for agentic triage."
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["triage_db*"]
