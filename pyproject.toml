[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["contracts", ".venv"]

[tool.ruff.lint]
# E501 is off so the existing contract-gate scripts stay untouched.
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["services/api", "services/worker", "deploy/simulator"]
mypy_path = ["db", "services/agent/src", "."]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["contracts/", "^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["services/api", "db", "services/agent/src"]
markers = ["e2e: compose end-to-end tests; excluded from the unit job"]
addopts = "-q"
