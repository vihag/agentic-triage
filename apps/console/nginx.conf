server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API: the browser calls /v1/* here and nginx forwards to the api container (no CORS).
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
